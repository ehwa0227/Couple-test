<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💕 Relationship Recap Quiz 💕</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ffe4ec,#fff5f8);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:white;
    border-radius:30px;
    padding:35px;
    box-shadow:0 20px 40px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#ff4d88;
    margin-top:0;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.progress-bar{
    width:100%;
    height:16px;
    background:#f1f1f1;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#ff4d88;
    transition:0.4s;
}

.question-number{
    font-weight:bold;
    color:#ff4d88;
    margin-bottom:10px;
}

.question{
    font-size:1.15rem;
    line-height:1.6;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    font-size:1rem;
    border:2px solid #ffd2df;
    border-radius:12px;
}

button{
    width:100%;
    margin-top:15px;
    border:none;
    background:#ff4d88;
    color:white;
    padding:14px;
    border-radius:12px;
    font-size:1rem;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.feedback{
    min-height:40px;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.score{
    text-align:center;
    margin-top:10px;
    color:#777;
}

.result{
    text-align:center;
}

.answer-list{
    text-align:left;
    max-height:500px;
    overflow:auto;
    margin-top:20px;
}

.answer-item{
    padding:8px 0;
    border-bottom:1px solid #eee;
}

</style>
</head>
<body>

<div class="container">

<div id="app">

<h1>💕 Relationship Recap Quiz 💕</h1>

<div class="subtitle">
Think you know me?<br>
Let's see how much you remember about me and our journey together.
</div>

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>

<div class="question-number" id="questionNumber"></div>

<div class="question" id="question"></div>

<input type="text" id="answer" placeholder="정답을 입력하세요">

<button onclick="submitAnswer()">정답 제출</button>

<div class="feedback" id="feedback"></div>

<div class="score" id="score"></div>

</div>

</div>

<script>

const quiz = [

["마사지 잘하고 깨끗하게 씻겨주고 따뜻하게 재워주는 이화가 사는 마을 이름은?","백송마을"],
["단풍 들면 다시 가기로 했던 출렁다리가 있던 데이트 장소는?","마장호수"],
["이화가 인정하지 않는 오빠의 추구미는?","더티섹시"],
["주3회 이화가 하는 운동은?","수영"],
["처음 동호는 이렇게 예쁜 애가 왜 날 만나지 라고 생각하며 이화를 OOOOO으로 의심했다","장기털이범"],
["이화네 집 포인트 컬러는?","그린"],
["이화는 밥은 안 먹어도 OO을 먹지 않으면 우울하다","과일"],
["밤리단 길에서 갔던 카페 이름은?","미루꾸커피"],
["이화의 MBTI는?","ENFJ"],
["이화의 인생 첫 번째 외국계 회사는?","HSBC"],
["그렇다면 지금 다니고 있는 회사 이름은?","Syneos health"],
["영국식 영어를 구사하는 이화가 가잘 잘 발음하는 것은?","포테이토 크리슾스프스프스프ㅅ"],
["이화가 가장 좋아하는 술과 안주의 조합은?","맥주와 감자튀김"],
["아이스크림, 더블핫도그, 환타로 이화가 입 터졌던 데이트 장소는?","이케아"],
["이화는 주말엔 목욕을 가는데 이때 꼭 사가는 것은?","아이스아메리카노"],
["이화의 핸드폰 기종은?","아이폰14"],
["이화의 30대를 함께한 사랑하는 강아지 이름은?","으리"],
["건강검진때 이화의 키는 약173cm였다 여기서 이화의 몸무게를 뺀 숫자는?","114"],
["이화가 운전을 했었을 때 마지막에 소유했던 차종은?","기아 K3"],
["우리가 사귀기로 한 날의 날짜는? O월OO일 형식","9월18일"],
["동호가 이화에게 처음으로 줬던 물건은?","라부르켓 립밤"],
["솔직히 이화가 가장 낭패였다고 생각하는 데이트 장소는?","두리랜드"],
["이화가 붙여준 동호의 가장 예쁜 곳의 별명은?","도토리"],
["일산호수공원에서 함께 봤던 쇼는?","불꽃드론쇼"],
["고기러버인 우리가 처음 만났던 장소는?","산청숯불가든 을지로 2호점"],
["이화네 엄마가 지난 추석에 메인으로 하신 음식은?","돼지갈비찜"],
["우리가 함께 본 첫번째 영화는?","암살자들"],
["바르셀로나 출장에서 동호가 이화에게 사다주고싶은 기념품은?","티팬티"],
["동호의 섹스 판타지인 물방아찧기를 고급지게 바꾸면?","수중섹스"],
["우리가 처음 함께 가게 될 여행지는?","부산"]

];

let current = 0;
let score = 0;

function renderQuestion(){

const percent = (current/quiz.length)*100;

document.getElementById('progressFill').style.width = percent + '%';

document.getElementById('questionNumber').innerHTML =
`문제 ${current+1} / ${quiz.length}`;

document.getElementById('question').innerHTML =
quiz[current][0];

document.getElementById('score').innerHTML =
`현재 점수 : ${score}`;

document.getElementById('answer').value='';

document.getElementById('answer').focus();

}

function submitAnswer(){

const user =
document.getElementById('answer')
.value
.trim()
.replace(/\s/g,'')
.toLowerCase();

const correct =
quiz[current][1]
.trim()
.replace(/\s/g,'')
.toLowerCase();

let isCorrect = false;

if(user === correct){
    isCorrect = true;
}

if(
 quiz[current][1] === "ENFJ" &&
 (user==="enfj" || user==="이엔에프제이")
){
    isCorrect = true;
}

if(isCorrect){

score++;

document.getElementById('feedback').innerHTML =
"❤️ 정답! 쫌 치네?";

document.getElementById('feedback').style.color='green';

}else{

document.getElementById('feedback').innerHTML =
"❌ 나 완전 실망이야!! 다음 문제로...";

document.getElementById('feedback').style.color='red';

}

current++;

setTimeout(()=>{

document.getElementById('feedback').innerHTML='';

if(current < quiz.length){

renderQuestion();

}else{

showResult();

}

},1200);

}

function showResult(){

let msg='';

if(score===30){

msg='💍 혼인신고 대기중';

}else if(score>=27){

msg='💕 거의 남편 수준';

}else if(score>=23){

msg='💖 예비 신랑 후보';

}else if(score>=18){

msg='🥰 애정도 합격';

}else if(score>=12){

msg='😏 복습 후 재시험 권장';

}else{

msg='🤣 우리 얘기 좀 할까???';
}

document.getElementById('app').innerHTML =

`
<div class="result">

<h1>💕 Quiz Complete 💕</h1>

<h2>${score} / ${quiz.length}</h2>

<h3>${msg}</h3>

<button onclick="showAnswers()">
정답 보고 쉽게 쉽게 갈거야?
</button>

</div>
`;

}

function showAnswers(){

let html = `
<h1>💕 Answer Sheet 💕</h1>
<div class="answer-list">
`;

quiz.forEach((item,index)=>{

html += `
<div class="answer-item">
<b>${index+1}.</b>
${item[1]}
</div>
`;

});

html += `
</div>

<button onclick="location.reload()">
다시 하기
</button>
`;

document.getElementById('app').innerHTML = html;

}

document.addEventListener('keydown',function(e){

if(e.key==='Enter' && current < quiz.length){

submitAnswer();

}

});

renderQuestion();

</script>

</body>
</html>
